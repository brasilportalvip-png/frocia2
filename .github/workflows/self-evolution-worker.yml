name: Self-Evolution Worker (Isolated Sandbox)

on:
  workflow_dispatch:
    inputs:
      candidateId:
        description: Candidate ID for self-evolution
        required: true
        type: string
      riskLevel:
        description: Risk Level (R1, R2, R3)
        required: true
        default: R1
        type: choice
        options:
          - R1
          - R2
          - R3

permissions:
  contents: read

concurrency:
  group: self-evolution-${{ github.event.inputs.candidateId }}
  cancel-in-progress: false

jobs:
  code-agent-worker:
    name: Code Agent Worker & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: ${{ github.event.inputs.riskLevel == 'R3' && 'production-approvals' || 'sandbox' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Full Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=moderate
