name: Froc.IA CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Validate Worker Browser Version
        run: node scripts/validate-worker-browser-version.mjs

      - name: Clean Install Dependencies
        run: npm ci

      - name: Validate Prompt Master Tracker
        run: npm run validate:tracker

      - name: Validate Versioned Migrations
        run: npm run validate:migrations

      - name: Validate Production Integrity
        run: npm run validate:production-integrity

      - name: Validate Native Node Serverless Startup
        run: node scripts/validate-serverless-runtime.mjs

      - name: TypeScript Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Rules Tests
        run: npm run test:rules

      - name: Run AI Engine Tests
        run: npm run test:ai

      - name: Run AI Foundation Tests
        run: npm run test:foundation

      - name: Run Tool Runtime Tests
        run: npm run test:tools

      - name: Run Site Factory and Observability Tests
        run: npm run test:site-factory

      - name: Run Security and Release Governance Tests
        run: npm run test:security-release

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Browser E2E Gates
        run: npm run test:e2e

      - name: Run Professional Project Panel Browser Tests
        run: npx playwright test --config playwright.professional.config.ts

      - name: Run Full Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload Playwright Report on Failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
