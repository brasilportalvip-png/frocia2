name: Froc.IA CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  audit-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Validate Prompt Master Tracker
        run: npm run validate:tracker

      - name: Validate Production Integrity
        run: npm run validate:production-integrity

      - name: TypeScript Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Rules Tests
        run: npm run test:rules

      - name: Run AI Engine Tests
        run: npm run test:ai

      - name: Run AI Foundation Tests
        run: npm run test:foundation

      - name: Run Tool Runtime Tests
        run: npm run test:tools

      - name: Run Site Factory and Observability Tests
        run: npm run test:site-factory

      - name: Run Security and Release Governance Tests
        run: npm run test:security-release

      - name: Run Full Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=moderate
