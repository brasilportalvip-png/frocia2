name: Froc.IA - Validacao dos agentes
run-name: ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Recibo de solicitacao do proprietario
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frocia-agent-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run validate:production-integrity
      - run: npm run typecheck
      - run: node scripts/validate-serverless-runtime.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.professional.config.ts
      - run: npx playwright test
      - name: Registrar escopo da verificacao
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "## Validacao automatizada: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite local e navegador. Nao comprova pagamentos reais, modelos externos, entrega de projeto ou todos os fluxos em producao. Nenhum deploy solicitado." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: agent-validation-browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
