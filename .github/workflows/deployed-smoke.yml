name: Deployed Environment Smoke Gate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL do deployment a validar
        required: true
        type: string
      environment:
        description: Ambiente protegido do GitHub
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deployed-smoke-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate target URL
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          node -e "const url = new URL(process.env.TARGET_URL); if (url.protocol !== 'https:' || ['localhost', '127.0.0.1'].includes(url.hostname)) process.exit(1)"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed smoke gates
        env:
          E2E_BASE_URL: ${{ inputs.target_url }}
        run: npx playwright test e2e/deployed-production-gates.spec.ts --project=chromium-desktop

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployed-smoke-${{ inputs.environment }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 30
