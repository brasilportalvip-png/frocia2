name: Froc.IA - Autoevolucao Externa

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frocia-self-evolution-external
  cancel-in-progress: false

jobs:
  execute:
    if: ${{ vars.SELF_EVOLUTION_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir worker da Froc.IA
        run: docker build -t frocia-worker ./worker

      - name: Iniciar worker local
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELF_EVOLUTION_WORKER_TOKEN: ${{ secrets.SELF_EVOLUTION_WORKER_TOKEN }}
          SELF_EVOLUTION_WORKER_SIGNING_SECRET: ${{ secrets.SELF_EVOLUTION_WORKER_SIGNING_SECRET }}
        run: |
          docker run -d \
            --name frocia-worker \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add SETUID \
            --cap-add SETGID \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            -p 127.0.0.1:8080:8080 \
            -e GEMINI_API_KEY \
            -e SELF_EVOLUTION_WORKER_TOKEN \
            -e SELF_EVOLUTION_WORKER_SIGNING_SECRET \
            -e SANDBOX_REPOSITORY_URL=https://github.com/brasilportalvip-png/frocia2.git \
            -e GITHUB_BASE_BRANCH=main \
            -e SANDBOX_NETWORK_POLICY=restricted \
            frocia-worker

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "Worker iniciado com sucesso"
              exit 0
            fi
            sleep 2
          done

          echo "Worker nao respondeu"
          docker logs frocia-worker
          exit 1

      - name: Executar ciclo de autoevolucao
        env:
          NODE_ENV: production
          SELF_EVOLUTION_RUNNER_ENABLED: 'true'
          SELF_EVOLUTION_ENABLED: 'true'
          AUTONOMOUS_PRODUCTION_DEPLOY_ENABLED: ${{ vars.AUTONOMOUS_PRODUCTION_DEPLOY_ENABLED }}

          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

          SELF_EVOLUTION_WORKER_URL: http://127.0.0.1:8080
          SELF_EVOLUTION_WORKER_TOKEN: ${{ secrets.SELF_EVOLUTION_WORKER_TOKEN }}
          SELF_EVOLUTION_WORKER_SIGNING_SECRET: ${{ secrets.SELF_EVOLUTION_WORKER_SIGNING_SECRET }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: brasilportalvip-png
          GITHUB_REPO: frocia2
          GITHUB_BASE_BRANCH: main

          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

        run: node --import tsx scripts/self-evolution-runner.ts --run