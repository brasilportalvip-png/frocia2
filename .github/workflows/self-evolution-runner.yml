name: Froc.IA - Autoevolucao Externa

on:
  workflow_dispatch:
  schedule:
    # 09h17 de Brasilia; recuperacao e retomada de CI/preview a cada 30 min ate 20h47.
    - cron: '17,47 12-23 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: frocia-self-evolution-external
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.schedule.outputs.should_run }}
    steps:
      - name: Baixar verificacao do agendamento
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restringir rede da verificacao
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2; inclui a correcao de conectividade do v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443

      - name: Verificar se o ciclo de hoje precisa executar
        id: schedule
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SELF_EVOLUTION_RUNNER_ENABLED: ${{ vars.SELF_EVOLUTION_RUNNER_ENABLED }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/self-evolution-schedule.mjs`);
            const { planSelfEvolutionRun } = await import(scriptUrl.href);
            const decision = await planSelfEvolutionRun({
              github, context, enabled: process.env.SELF_EVOLUTION_RUNNER_ENABLED,
            });
            core.setOutput('should_run', String(decision.shouldRun));
            core.info(`[self-evolution-schedule] ${decision.dateKey}: ${decision.reason}`);
            if (decision.reason === 'runner_disabled') {
              core.warning('Agendamento bloqueado: SELF_EVOLUTION_RUNNER_ENABLED=false nas variaveis do repositorio.');
            }
            const messages = {
              manual: 'Execucao manual solicitada.',
              runner_disabled: 'Bloqueado pela variavel SELF_EVOLUTION_RUNNER_ENABLED=false.',
              before_daily_window: 'Aguardando 09h17 de Brasilia; um evento antigo chegou atrasado.',
              already_completed: 'O ciclo de hoje ja executou com sucesso; worker e modelos nao serao chamados novamente.',
              missing_daily_run: 'Nenhuma execucao concluida hoje; iniciando o ciclo automatico ou sua recuperacao.',
            };
            core.summary
              .addHeading('Agendamento dos agentes')
              .addTable([
                [{ data: 'Campo', header: true }, { data: 'Valor', header: true }],
                ['Dia (America/Sao_Paulo)', decision.dateKey],
                ['Gatilho', context.eventName],
                ['Decisao', messages[decision.reason]],
                ['Horario', '09h17; recuperacao e retomada a cada 30 min ate 20h47, horario de Brasilia'],
              ]);
            if (decision.completedRunUrl) {
              core.summary.addLink('Execucao ja concluida hoje', decision.completedRunUrl);
            }
            await core.summary.write();

  execute:
    needs: check-schedule
    if: ${{ needs.check-schedule.outputs.should_run == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Conferir acesso seguro ao GitHub
        shell: bash
        run: |
          set -euo pipefail
          echo "Verificando GitHub na rede protegida..."
          getent ahostsv4 github.com | head -n 5 || true
          curl --ipv4 --fail --silent --show-error --head --connect-timeout 10 --max-time 25 https://github.com/ > /dev/null
          echo "GitHub acessivel."

      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restringir conexoes externas
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2; inclui a correcao de conectividade do v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            *.docker.io:443
            deb.debian.org:80
            security.debian.org:80
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            playwright.azureedge.net:443
            generativelanguage.googleapis.com:443
            firestore.googleapis.com:443
            oauth2.googleapis.com:443
            identitytoolkit.googleapis.com:443
            securetoken.googleapis.com:443
            www.googleapis.com:443
            www.gstatic.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            portalvipbrasil.com.br:443
            api.vercel.com:443
            *.vercel.app:443

      - name: Validar destinos do build e navegador
        shell: bash
        run: |
          set -euo pipefail
          for host in github.com nodejs.org release-assets.githubusercontent.com registry.npmjs.org auth.docker.io registry-1.docker.io production.cloudfront.docker.com cdn.playwright.dev playwright.download.prss.microsoft.com storage.googleapis.com generativelanguage.googleapis.com firestore.googleapis.com; do
            echo "Verificando TLS para ${host}:443"
            if ! curl --ipv4 --head --silent --show-error --connect-timeout 6 --max-time 15 "https://${host}/" --output /dev/null; then
              echo "::error::Destino necessario bloqueado ou inacessivel: ${host}:443"
              exit 1
            fi
          done

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir worker da Froc.IA
        run: docker build -t frocia-worker ./worker

      - name: Preparar conta de teste autenticada
        continue-on-error: true
        env:
          NODE_ENV: test
          SELF_EVOLUTION_ENABLED: 'true'
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          BROWSER_TEST_AUTO_PROVISION_ENABLED: ${{ vars.BROWSER_TEST_AUTO_PROVISION_ENABLED || 'true' }}
          SELF_EVOLUTION_TARGET_URL: ${{ vars.SELF_EVOLUTION_TARGET_URL || 'https://frocia2.vercel.app/' }}
          BROWSER_TEST_LOGIN_URL: ${{ vars.BROWSER_TEST_LOGIN_URL || secrets.BROWSER_TEST_LOGIN_URL }}
          BROWSER_TEST_USER: ${{ secrets.BROWSER_TEST_USER }}
          BROWSER_TEST_PASSWORD: ${{ secrets.BROWSER_TEST_PASSWORD }}
          BROWSER_USER_SELECTOR: ${{ vars.BROWSER_USER_SELECTOR }}
          BROWSER_PASSWORD_SELECTOR: ${{ vars.BROWSER_PASSWORD_SELECTOR }}
          BROWSER_SUBMIT_SELECTOR: ${{ vars.BROWSER_SUBMIT_SELECTOR }}
          BROWSER_LOGIN_OPEN_SELECTOR: ${{ vars.BROWSER_LOGIN_OPEN_SELECTOR }}
          BROWSER_AUTHENTICATED_SELECTOR: ${{ vars.BROWSER_AUTHENTICATED_SELECTOR }}
        run: node --import tsx scripts/prepare-browser-test-account.ts --run

      - name: Iniciar worker local
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELF_EVOLUTION_WORKER_TOKEN: ${{ secrets.SELF_EVOLUTION_WORKER_TOKEN }}
          SELF_EVOLUTION_WORKER_SIGNING_SECRET: ${{ secrets.SELF_EVOLUTION_WORKER_SIGNING_SECRET }}
        run: |
          docker run -d \
            --name frocia-worker \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add DAC_OVERRIDE \
            --cap-add KILL \
            --cap-add SETUID \
            --cap-add SETGID \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            -p 127.0.0.1:8080:8080 \
            -e GEMINI_API_KEY \
            -e SELF_EVOLUTION_WORKER_TOKEN \
            -e SELF_EVOLUTION_WORKER_SIGNING_SECRET \
            -e BROWSER_TEST_LOGIN_URL \
            -e BROWSER_TEST_USER \
            -e BROWSER_TEST_PASSWORD \
            -e BROWSER_LOGIN_USE_TARGET_ORIGIN \
            -e BROWSER_USER_SELECTOR \
            -e BROWSER_PASSWORD_SELECTOR \
            -e BROWSER_SUBMIT_SELECTOR \
            -e BROWSER_LOGIN_OPEN_SELECTOR \
            -e BROWSER_AUTHENTICATED_SELECTOR \
            -e SANDBOX_REPOSITORY_URL=https://github.com/brasilportalvip-png/frocia2.git \
            -e GITHUB_BASE_BRANCH=main \
            -e SELF_EVOLUTION_FULL_REPOSITORY_ACCESS=true \
            -e SANDBOX_NETWORK_POLICY=restricted \
            frocia-worker

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "Worker iniciado com sucesso"
              exit 0
            fi
            sleep 2
          done

          echo "Worker nao respondeu"
          docker logs frocia-worker
          exit 1

      - name: Verificar permissoes e rollback da sandbox
        run: docker exec frocia-worker node /worker/sandbox-preflight.mjs

      - name: Verificar isolamento de rede do worker
        run: |
          echo "Testando conexao permitida com Google..."
          docker exec --user 10001:10001 frocia-worker node -e "fetch('https://generativelanguage.googleapis.com', {signal: AbortSignal.timeout(10000)}).then(() => process.exit(0)).catch(() => process.exit(1))"

          echo "Testando bloqueio de conexao nao autorizada..."
          if docker exec --user 10001:10001 frocia-worker node -e "fetch('https://example.com', {signal: AbortSignal.timeout(8000)}).then(() => process.exit(0)).catch(() => process.exit(1))"; then
            echo "FALHA: worker conseguiu acessar destino nao autorizado."
            exit 1
          fi

          echo "Teste de bloqueio concluido."

      - name: Executar ciclo de autoevolucao
        id: cycle
        env:
          NODE_ENV: test
          SELF_EVOLUTION_RUNNER_ENABLED: 'true'
          SELF_EVOLUTION_ENABLED: 'true'
          SELF_EVOLUTION_FULL_REPOSITORY_ACCESS: 'true'
          # Autonomia solicitada pelo proprietario; a variavel false continua como parada explicita.
          AUTONOMOUS_PRODUCTION_DEPLOY_ENABLED: ${{ vars.AUTONOMOUS_PRODUCTION_DEPLOY_ENABLED || 'true' }}

          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          SELF_EVOLUTION_WORKER_URL: http://127.0.0.1:8080
          SELF_EVOLUTION_WORKER_TOKEN: ${{ secrets.SELF_EVOLUTION_WORKER_TOKEN }}
          SELF_EVOLUTION_WORKER_SIGNING_SECRET: ${{ secrets.SELF_EVOLUTION_WORKER_SIGNING_SECRET }}

          # App/token proprio tem prioridade. O token do Actions usa dispatch explicito do CI.
          GITHUB_TOKEN: ${{ secrets.SELF_EVOLUTION_GITHUB_TOKEN || (secrets.FROC_GITHUB_APP_PRIVATE_KEY == '' && secrets.FROC_GITHUB_APP_TOKEN == '' && github.token) || '' }}
          SELF_EVOLUTION_CI_DISPATCH_REQUIRED: ${{ secrets.SELF_EVOLUTION_GITHUB_TOKEN == '' && secrets.FROC_GITHUB_APP_PRIVATE_KEY == '' && secrets.FROC_GITHUB_APP_TOKEN == '' && 'true' || 'false' }}
          GITHUB_APP_TOKEN: ${{ secrets.FROC_GITHUB_APP_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          GITHUB_APP_ID: ${{ secrets.FROC_GITHUB_APP_ID || vars.FROC_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.FROC_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_SLUG: ${{ vars.FROC_GITHUB_APP_SLUG || secrets.FROC_GITHUB_APP_SLUG }}
          GITHUB_OWNER: brasilportalvip-png
          GITHUB_REPO: frocia2
          GITHUB_BASE_BRANCH: main

          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          SELF_EVOLUTION_TARGET_URL: ${{ vars.SELF_EVOLUTION_TARGET_URL || 'https://frocia2.vercel.app/' }}

        run: |
          node scripts/self-evolution-worker-diagnostics.mjs --watch &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true; wait "$diagnostics_pid" 2>/dev/null || true' EXIT
          node --import tsx scripts/self-evolution-runner.ts --run

      - name: Registrar diagnostico do worker
        if: ${{ always() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELF_EVOLUTION_WORKER_TOKEN: ${{ secrets.SELF_EVOLUTION_WORKER_TOKEN }}
          SELF_EVOLUTION_WORKER_SIGNING_SECRET: ${{ secrets.SELF_EVOLUTION_WORKER_SIGNING_SECRET }}
        run: node scripts/self-evolution-worker-diagnostics.mjs

      - name: Rodada diaria finalizada
        if: ${{ steps.cycle.outputs.requires_resume == 'false' }}
        run: echo "Rodada encerrada sem retomada pendente. Consulte o resumo para cobertura e bloqueios."
